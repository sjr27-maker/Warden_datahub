name: verify

on: [push, pull_request]

jobs:
  claim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Lint and unit tests
        run: |
          ruff check warden tests
          pytest -m "not live"

      - name: Prove the coverage gate
        # No LLM backend, no DataHub. If this passes, the central claim holds
        # independently of any model.
        env:
          WARDEN_LLM_BACKEND: none
        run: python verify.py

      - name: Near-miss gauntlet
        env:
          WARDEN_LLM_BACKEND: none
        run: python -m evidence.gauntlet